<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <span class="nav-logo">💪 GymTracker</span>
    <div class="nav-links">
      <button class="nav-btn active" data-tab="calendar">Calendar</button>
      <button class="nav-btn" data-tab="workout">Workout</button>
      <button class="nav-btn" data-tab="run">Run</button>
      <button class="nav-btn" data-tab="history">History</button>
      <button class="nav-btn" data-tab="records">PRs</button>
      <button class="nav-btn" data-tab="shoes">Shoes</button>
    </div>
  </nav>

  <main class="container">

    <!-- ── CALENDAR TAB ── -->
    <section id="tab-calendar" class="tab active">
      <div class="cal-header">
        <button class="cal-nav" id="cal-prev">‹</button>
        <h2 id="cal-title"></h2>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-legend">
        <span class="dot dot-workout"></span> Workout
        <span class="dot dot-run"></span> Run
        <span class="dot dot-both"></span> Both
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div id="cal-detail" class="cal-detail hidden"></div>
    </section>

    <!-- ── WORKOUT TAB ── -->
    <section id="tab-workout" class="tab">
      <div id="workout-setup">
        <div class="card form-card">
          <h2 class="form-title">Start a session</h2>
          <div class="form-row">
            <div class="field">
              <label>Date</label>
              <input type="date" id="w-date" required />
            </div>
            <div class="field">
              <label>Exercise day</label>
              <select id="w-day">
                <option value="">Select day</option>
              </select>
            </div>
          </div>
          <button id="start-session-btn" class="btn-primary" disabled>Start session</button>
        </div>
      </div>

      <div id="workout-session" class="hidden">
        <div class="session-topbar">
          <div>
            <div class="session-day-label" id="session-day-label"></div>
            <div class="session-date-label" id="session-date-label"></div>
          </div>
          <div class="timer-chip" id="session-timer">00:00:00</div>
        </div>

        <div id="exercise-list" class="exercise-list"></div>

        <button id="add-exercise-btn" class="add-exercise-btn">+ Add exercise</button>

        <div id="exercise-picker" class="exercise-picker hidden">
          <input type="text" id="exercise-search" placeholder="Search exercises…" />
          <div id="exercise-picker-list" class="exercise-picker-list"></div>
        </div>

        <div class="session-actions">
          <button id="discard-session-btn" class="btn-discard">Discard session</button>
          <button id="finish-session-btn" class="btn-finish">Finish session</button>
        </div>
      </div>
    </section>

    <!-- ── RUN TAB ── -->
    <section id="tab-run" class="tab">
      <form id="run-form" class="card form-card">
        <h2 class="form-title">Log run</h2>
        <div class="form-row">
          <div class="field">
            <label>Date</label>
            <input type="date" id="r-date" required />
          </div>
          <div class="field">
            <label>Location</label>
            <input type="text" id="r-location" placeholder="e.g. Rizal Park" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Distance (km)</label>
            <input type="number" id="r-distance" min="0" step="0.01" placeholder="5.0" />
          </div>
          <div class="field">
            <label>Time (hh:mm:ss)</label>
            <input type="text" id="r-time" placeholder="00:30:00" />
          </div>
        </div>
        <div class="field">
          <label>Shoe</label>
          <select id="r-shoe">
            <option value="">No shoe selected</option>
          </select>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="r-notes" rows="2" placeholder="Route, how you felt…"></textarea>
        </div>
        <button type="submit" class="btn-primary">Save run</button>
      </form>
    </section>

    <!-- ── HISTORY TAB ── -->
    <section id="tab-history" class="tab">
      <div class="tab-header">
        <h2>History</h2>
        <div class="filter-row">
          <select id="filter-type">
            <option value="all">All</option>
            <option value="workout">Workouts</option>
            <option value="run">Runs</option>
          </select>
          <select id="filter-day">
            <option value="all">All days</option>
          </select>
        </div>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>

    <!-- ── RECORDS TAB ── -->
    <section id="tab-records" class="tab">
      <div class="tab-header">
        <h2>Personal records</h2>
        <input type="text" id="pr-search" placeholder="Search exercise…" class="search-input" />
      </div>
      <div id="records-list" class="records-list"></div>
    </section>

    <!-- ── SHOES TAB ── -->
    <section id="tab-shoes" class="tab">
      <div class="tab-header">
        <h2>Shoes</h2>
        <button id="add-shoe-btn" class="btn-add-shoe">+ Add shoe</button>
      </div>

      <div id="shoe-form-wrap" class="shoe-form-wrap hidden">
        <div class="card form-card">
          <h2 class="form-title" id="shoe-form-title">Add shoe</h2>
          <div class="form-row">
            <div class="field">
              <label>Brand</label>
              <input type="text" id="shoe-brand" placeholder="e.g. Nike" />
            </div>
            <div class="field">
              <label>Model</label>
              <input type="text" id="shoe-model" placeholder="e.g. Pegasus 41" />
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label>Starting km</label>
              <input type="number" id="shoe-start-km" min="0" step="0.1" placeholder="0" />
            </div>
            <div class="field">
              <label>Max km (recommended)</label>
              <input type="number" id="shoe-max-km" min="0" step="10" placeholder="800" />
            </div>
          </div>
          <div class="field">
            <label>Notes</label>
            <input type="text" id="shoe-notes" placeholder="Colour, size, etc." />
          </div>
          <div style="display:flex;gap:10px">
            <button type="button" id="shoe-form-cancel" class="btn-discard" style="flex:1">Cancel</button>
            <button type="button" id="shoe-form-save" class="btn-finish" style="flex:2">Save shoe</button>
          </div>
        </div>
      </div>

      <div id="shoes-list" class="shoes-list"></div>
    </section>

  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
