<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <span class="nav-logo">💪 GymTracker</span>
    <div class="nav-links">
      <button class="nav-btn active" data-tab="calendar">Calendar</button>
      <button class="nav-btn" data-tab="workout">Workout</button>
      <button class="nav-btn" data-tab="run">Run</button>
      <button class="nav-btn" data-tab="history">History</button>
      <button class="nav-btn" data-tab="records">PRs</button>
    </div>
  </nav>

  <main class="container">

    <!-- ── CALENDAR TAB (default) ── -->
    <section id="tab-calendar" class="tab active">
      <div class="cal-header">
        <button class="cal-nav" id="cal-prev">‹</button>
        <h2 id="cal-title"></h2>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-legend">
        <span class="dot dot-workout"></span> Workout
        <span class="dot dot-run"></span> Run
        <span class="dot dot-both"></span> Both
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div id="cal-detail" class="cal-detail hidden"></div>
    </section>

    <!-- ── WORKOUT TAB ── -->
    <section id="tab-workout" class="tab">
      <form id="workout-form" class="card form-card">
        <h2 class="form-title">Log workout</h2>

        <div class="form-row">
          <div class="field">
            <label>Date</label>
            <input type="date" id="w-date" required />
          </div>
          <div class="field">
            <label>Exercise day</label>
            <select id="w-day" required>
              <option value="">Select day</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Exercise</label>
          <select id="w-exercise" required disabled>
            <option value="">Select exercise day first</option>
          </select>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Target muscles</label>
            <div id="w-muscles" class="tag-display">—</div>
          </div>
          <div class="field">
            <label>Equipment</label>
            <div id="w-equipment" class="tag-display">—</div>
          </div>
        </div>

        <!-- PR info bar -->
        <div id="pr-bar" class="pr-bar hidden">
          <div class="pr-item">
            <span class="pr-label">Last session</span>
            <span id="pr-last" class="pr-value">—</span>
          </div>
          <div class="pr-divider"></div>
          <div class="pr-item">
            <span class="pr-label">All-time PR</span>
            <span id="pr-best" class="pr-value">—</span>
          </div>
        </div>

        <div class="form-row three-col">
          <div class="field">
            <label>Sets</label>
            <input type="number" id="w-sets" min="1" max="20" placeholder="3" />
          </div>
          <div class="field">
            <label>Reps</label>
            <input type="number" id="w-reps" min="1" max="100" placeholder="10" />
          </div>
          <div class="field">
            <label>Weight (kg)</label>
            <input type="number" id="w-weight" min="0" step="0.5" placeholder="60" />
          </div>
        </div>

        <div class="field">
          <label>Comments</label>
          <textarea id="w-comments" rows="2" placeholder="How did it feel? Any notes…"></textarea>
        </div>

        <button type="submit" class="btn-primary">Save workout</button>
      </form>
    </section>

    <!-- ── RUN TAB ── -->
    <section id="tab-run" class="tab">
      <form id="run-form" class="card form-card">
        <h2 class="form-title">Log run</h2>

        <div class="form-row">
          <div class="field">
            <label>Date</label>
            <input type="date" id="r-date" required />
          </div>
          <div class="field">
            <label>Location</label>
            <input type="text" id="r-location" placeholder="e.g. Rizal Park" />
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label>Distance (km)</label>
            <input type="number" id="r-distance" min="0" step="0.01" placeholder="5.0" />
          </div>
          <div class="field">
            <label>Time (hh:mm:ss)</label>
            <input type="text" id="r-time" placeholder="00:30:00" pattern="\d{2}:\d{2}:\d{2}" />
          </div>
        </div>

        <div class="field">
          <label>Notes</label>
          <textarea id="r-notes" rows="2" placeholder="Route, how you felt…"></textarea>
        </div>

        <button type="submit" class="btn-primary">Save run</button>
      </form>
    </section>

    <!-- ── HISTORY TAB ── -->
    <section id="tab-history" class="tab">
      <div class="tab-header">
        <h2>History</h2>
        <div class="filter-row">
          <select id="filter-type">
            <option value="all">All</option>
            <option value="workout">Workouts</option>
            <option value="run">Runs</option>
          </select>
          <select id="filter-day">
            <option value="all">All days</option>
          </select>
        </div>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>

    <!-- ── RECORDS TAB ── -->
    <section id="tab-records" class="tab">
      <div class="tab-header">
        <h2>Personal records</h2>
        <input type="text" id="pr-search" placeholder="Search exercise…" class="search-input" />
      </div>
      <div id="records-list" class="records-list"></div>
    </section>

  </main>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
