<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e8533a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymTracker" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <!-- Leaflet map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    try {
      const mod = await import("https://cdn.jsdelivr.net/npm/body-highlighter@latest/dist/body-highlighter.esm.js");
      window.createBodyHighlighter = mod.default || mod.createBodyHighlighter;
    } catch(e) { console.warn("body-highlighter failed to load:", e); }
  </script>
</head>
<body>

  <nav class="navbar">
    <span class="nav-logo">💪 GymTracker</span>
    <div class="nav-links">
      <button class="nav-btn active" data-tab="calendar">Calendar</button>
      <button class="nav-btn" data-tab="workout">Workout</button>
      <button class="nav-btn" data-tab="run">Run</button>
      <button class="nav-btn" data-tab="history">History</button>
      <button class="nav-btn" data-tab="records">PRs</button>
      <button class="nav-btn" data-tab="shoes">Shoes</button>
      <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙</button>
    </div>
  </nav>

  <main class="container">

    <!-- ── CALENDAR ── -->
    <section id="tab-calendar" class="tab active">
      <div class="cal-header">
        <button class="cal-nav" id="cal-prev">‹</button>
        <h2 id="cal-title"></h2>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-legend">
        <span class="dot dot-workout"></span> Workout
        <span class="dot dot-run"></span> Run
        <span class="dot dot-both"></span> Both
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div id="cal-detail" class="cal-detail hidden"></div>
    </section>

    <!-- ── WORKOUT ── -->
    <section id="tab-workout" class="tab">

      <div id="workout-setup">
        <div class="card form-card">
          <div class="setup-card-header">
            <h2 class="form-title" style="margin-bottom:0">Start a session</h2>
            <button class="exercises-mgr-btn" id="open-exercise-mgr">⚙️ Exercises</button>
          </div>
          <div class="form-row" style="margin-top:1rem">
            <div class="field">
              <label>Date</label>
              <div class="date-picker-wrap">
                <div class="date-display" id="w-date-display">Select date</div>
                <input type="date" id="w-date" class="date-hidden" required />
              </div>
            </div>
            <div class="field">
              <label>Exercise day</label>
              <select id="w-day" autocomplete="off"><option value="">Select day</option></select>
            </div>
          </div>
          <button id="start-session-btn" class="btn-primary" disabled>Start session</button>
        </div>
      </div>

      <div id="exercise-manager" class="hidden">
        <div class="card form-card">
          <div class="setup-card-header">
            <h2 class="form-title" style="margin-bottom:0">Exercise library</h2>
            <button class="exercises-mgr-btn" id="close-exercise-mgr">✕ Close</button>
          </div>
          <div style="margin-top:1rem;margin-bottom:0.75rem;display:flex;gap:8px;align-items:center">
            <input type="text" id="ex-mgr-search" autocomplete="off" autocorrect="off" placeholder="Search exercises…" style="flex:1" />
            <button class="btn-primary" id="add-new-exercise-btn" style="width:auto;padding:9px 14px;white-space:nowrap">+ New</button>
          </div>
          <div id="ex-edit-form" class="ex-edit-form hidden">
            <div class="field"><label>Exercise name</label><input type="text" id="ex-name-input" autocomplete="off" autocorrect="off" placeholder="e.g. Incline dumbbell press" /></div>
            <div class="field" style="margin-top:0.75rem">
              <label>Exercise days</label>
              <div id="ex-days-tags" class="tag-editor"></div>
              <select id="ex-days-add" style="margin-top:5px"><option value="">+ Add day…</option></select>
            </div>
            <div class="field" style="margin-top:0.75rem">
              <label>Target muscles</label>
              <div id="ex-muscles-tags" class="tag-editor"></div>
              <select id="ex-muscles-add" style="margin-top:5px"><option value="">+ Add muscle…</option></select>
            </div>
            <div class="field" style="margin-top:0.75rem">
              <label>Equipment / machines</label>
              <div id="ex-equip-tags" class="tag-editor"></div>
              <div id="ex-equip-chips" class="equip-chips-wrap"></div>
              <input type="text" id="ex-equip-input" placeholder="Or type a new machine and press Enter…" style="margin-top:5px" autocomplete="off" />
            </div>
            <div style="display:flex;gap:8px;margin-top:1rem">
              <button id="ex-form-cancel" class="btn-discard" style="flex:1">Cancel</button>
              <button id="ex-form-save" class="btn-finish" style="flex:2">Save exercise</button>
            </div>
          </div>
          <div id="ex-mgr-list" class="ex-mgr-list"></div>
        </div>
      </div>

      <div id="workout-session" class="hidden">
        <div class="session-topbar">
          <div>
            <div class="session-day-label" id="session-day-label"></div>
            <div class="session-date-label" id="session-date-label"></div>
          </div>
          <div class="timer-chip" id="session-timer">00:00:00</div>
        </div>
        <div id="exercise-list" class="exercise-list"></div>
        <button id="add-exercise-btn" class="add-exercise-btn">+ Add exercise</button>
        <div id="exercise-picker" class="exercise-picker hidden">
          <input type="text" id="exercise-search" autocomplete="off" autocorrect="off" placeholder="Search exercises…" />
          <div id="exercise-picker-list" class="exercise-picker-list"></div>
        </div>
        <div class="session-actions">
          <button id="discard-session-btn" class="btn-discard">Discard session</button>
          <button id="finish-session-btn" class="btn-finish">Finish session</button>
        </div>
      </div>

    </section>

    <!-- ── RUN ── -->
    <section id="tab-run" class="tab">
      <form id="run-form" class="card form-card" autocomplete="off">
        <h2 class="form-title">Log run</h2>
        <div class="field">
          <label>Title</label>
          <input type="text" id="r-title" placeholder="e.g. Morning run, Race day…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        </div>
        <div class="form-row">
          <div class="field">
            <label>Date</label>
            <div class="date-picker-wrap">
              <div class="date-display" id="r-date-display">Select date</div>
              <input type="date" id="r-date" class="date-hidden" required />
            </div>
          </div>
          <div class="field">
            <label>Location</label>
            <input type="text" id="r-location" autocomplete="off" autocorrect="off" placeholder="e.g. Rizal Park" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Distance (km)</label>
            <input type="number" id="r-distance" inputmode="decimal" autocomplete="off" min="0" step="0.01" placeholder="5.0" />
          </div>
          <div class="field">
            <label>Time (hh:mm:ss)</label>
            <input type="text" id="r-time" autocomplete="off" autocorrect="off" placeholder="00:00:00" maxlength="8" inputmode="numeric" />
          </div>
        </div>
        <div class="field">
          <label>Shoe</label>
          <select id="r-shoe"><option value="">No shoe selected</option></select>
        </div>
        <div class="km-section">
          <div class="km-section-header">
            <span class="km-section-label">Per-km breakdown</span>
          </div>
          <div id="km-table-wrap">
            <table class="km-table">
              <thead><tr><th>Km</th><th>Pace (mm:ss)</th><th>HR (bpm)</th><th></th></tr></thead>
              <tbody id="km-tbody"></tbody>
            </table>
            <div class="add-km-cell">
              <button type="button" id="add-km-btn" class="add-km-below">+ Add km 1</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="r-notes" autocomplete="off" autocorrect="off" rows="2" placeholder="Route, how you felt…"></textarea>
        </div>
        <div style="display:flex;gap:10px">
          <button type="button" id="discard-run-btn" class="btn-discard" style="flex:1">Discard</button>
          <button type="submit" class="btn-primary" style="flex:2">Save run</button>
        </div>
      </form>

      <div class="card" style="margin-top:1rem">
        <div style="padding:1rem 1.25rem">
          <h3 style="font-size:0.9rem;font-weight:700;margin-bottom:1rem;text-align:center">Running PRs</h3>
          <div id="run-pr-grid" class="run-pr-grid"></div>
        </div>
      </div>
    </section>

    <!-- ── HISTORY ── -->
    <section id="tab-history" class="tab">
      <div class="tab-header">
        <h2>History</h2>
        <div class="filter-row">
          <select id="filter-type">
            <option value="all">All</option>
            <option value="workout">Workouts</option>
            <option value="run">Runs</option>
          </select>
          <select id="filter-day"><option value="all">All days</option></select>
          <button id="export-btn" class="btn-export">⬇ Export</button>
        </div>
      </div>

      <!-- Export panel -->
      <div id="export-panel" class="export-panel hidden">
        <div class="export-row">
          <div class="field" style="flex:1;margin-bottom:0">
            <label>From</label>
            <input type="date" id="export-from" />
          </div>
          <div class="field" style="flex:1;margin-bottom:0">
            <label>To</label>
            <input type="date" id="export-to" />
          </div>
          <div class="field" style="flex:1;margin-bottom:0">
            <label>Activity</label>
            <select id="export-type">
              <option value="all">All</option>
              <option value="workout">Workouts</option>
              <option value="run">Runs</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="export-cancel-btn" class="btn-discard" style="flex:1">Cancel</button>
          <button id="export-download-btn" class="btn-finish" style="flex:2">Download CSV</button>
        </div>
      </div>

      <div id="history-list" class="history-list"></div>
    </section>

    <!-- ── RECORDS ── -->
    <section id="tab-records" class="tab">
      <div class="tab-header">
        <h2>Personal records</h2>
        <input type="text" id="pr-search" autocomplete="off" autocorrect="off" placeholder="Search exercise…" class="search-input" />
      </div>
      <div id="records-list" class="records-list"></div>
    </section>

    <!-- ── SHOES ── -->
    <section id="tab-shoes" class="tab">
      <div class="tab-header">
        <h2>Shoes</h2>
        <button id="add-shoe-btn" class="btn-add-shoe">+ Add shoe</button>
      </div>
      <div id="shoe-form-wrap" class="shoe-form-wrap hidden">
        <div class="card form-card">
          <h2 class="form-title" id="shoe-form-title">Add shoe</h2>
          <div class="form-row">
            <div class="field"><label>Brand</label><input type="text" id="shoe-brand" autocomplete="off" autocorrect="off" placeholder="e.g. Nike" /></div>
            <div class="field"><label>Model</label><input type="text" id="shoe-model" autocomplete="off" autocorrect="off" placeholder="e.g. Pegasus 41" /></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Starting km</label><input type="number" id="shoe-start-km" inputmode="decimal" min="0" step="0.1" placeholder="0" /></div>
            <div class="field"><label>Max km (recommended)</label><input type="number" id="shoe-max-km" inputmode="numeric" min="0" step="10" placeholder="800" /></div>
          </div>
          <div class="field"><label>Notes</label><input type="text" id="shoe-notes" autocomplete="off" autocorrect="off" placeholder="Colour, size, etc." /></div>
          <div style="display:flex;gap:10px">
            <button type="button" id="shoe-form-cancel" class="btn-discard" style="flex:1">Cancel</button>
            <button type="button" id="shoe-form-save" class="btn-finish" style="flex:2">Save shoe</button>
          </div>
        </div>
      </div>
      <div id="shoes-list" class="shoes-list"></div>
    </section>

  </main>

  <div id="toast" class="toast hidden"></div>
  <script>
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("/sw.js").then(r=>console.log("SW registered")).catch(e=>console.warn("SW failed:",e));
    }
  </script>
  <script src="app-data.js"></script>
  <script src="app-core.js"></script>
  <script src="app-history.js"></script>
  <script src="app-gps.js"></script>
</body>
</html>
